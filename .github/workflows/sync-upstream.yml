# 工作流名称
name: Sync fork with upstream

on:
  # 每天北京时间 10:17 自动执行
  schedule:
    - cron: "17 10 * * *"
      timezone: "Asia/Shanghai"

  # 支持手动执行
  workflow_dispatch:

# 内置 GITHUB_TOKEN 只需要读取权限
# 实际同步使用下面的 SYNC_TOKEN
permissions:
  contents: read

# 防止多个同步任务同时运行
concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      # 自动读取当前 fork 的默认分支并同步
      - name: Sync default branch from upstream
        run: |
          # 读取当前 fork 的默认分支
          # 你的仓库当前读取结果是 dev
          DEFAULT_BRANCH=$(gh api \
            "repos/${{ github.repository }}" \
            --jq '.default_branch')

          # 检查读取结果
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "错误：无法读取当前 fork 的默认分支"
            exit 1
          fi

          echo "当前 fork 默认分支：${DEFAULT_BRANCH}"
          echo "开始从上游仓库同步默认分支……"

          # 自动识别上游仓库，并同步当前默认分支
          gh repo sync \
            "${{ github.repository }}" \
            --branch "${DEFAULT_BRANCH}"

          echo "默认分支 ${DEFAULT_BRANCH} 同步完成"
        env:
          # 使用具有 Contents 和 Workflows 写权限的 PAT
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
